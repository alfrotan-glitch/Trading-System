name: CI

# The repository's only functional CI. Before this, .github/workflows held
# sixteen one-off XAUUSD research jobs, every one triggered exclusively by
# pushes to a DIFFERENT session branch (arena/01a0cdf1-trading-system) — so no
# workflow ever linted or tested this branch, and no pull request was ever
# checked. Those jobs also ran with `contents: write` and
# `persist-credentials: true` and ended in
# `git push origin HEAD:arena/01a0cdf1-trading-system`, meaning a manual
# dispatch from any branch would have pushed that branch's HEAD into another
# session's branch. They are removed; this replaces them.

on:
  push:
    branches:
      - arena/01a0f151-trading-system
      - main
  pull_request:
  workflow_dispatch:

# Least privilege: CI reads the code and reports. It never writes to the
# repository, never pushes, and never needs a token with write scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (pinned constraints for a reproducible run)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: python -m ruff check src/ tests/ scripts/

      - name: Types
        run: python -m mypy src/qts

      # bandit was a declared dev dependency with a [tool.bandit] config and
      # 26 `# nosec` markers in the code, and nothing ever invoked it. Every
      # finding it had accumulated is now fixed or annotated with the reason
      # it is safe, so any NEW finding — at any severity — fails here.
      - name: Security (bandit)
        run: python -m bandit -c pyproject.toml -r src/qts -q

      - name: Offline static safety validation
        run: python scripts/demo_static_validation.py

      # Deterministic and honest: no `|| true`, no `--exitfirst`, no skipped
      # directories. A red suite fails the job and the real counts are printed.
      # `-ra` prints the reason for every non-passing test, so the summary says
      # which tests failed and why rather than only "exit code 1".
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest tests/ -q -ra -p no:cacheprovider --durations=10 2>&1 \
            | tee "$RUNNER_TEMP/pytest-output.txt"

      # A failure nobody can read is not a report. Log archives are not always
      # retrievable (the Actions log blob store is unreachable from some
      # networks, and logs expire), so the failing test ids and the final
      # counts are re-emitted as workflow annotations, which travel with the
      # run metadata and survive log expiry.
      - name: Report which tests failed
        if: failure()
        run: |
          log="$RUNNER_TEMP/pytest-output.txt"
          [ -f "$log" ] || { echo "::error::pytest produced no output file"; exit 0; }
          grep -E '^(FAILED|ERROR)' "$log" | while IFS= read -r line; do
            echo "::error::${line}"
          done
          # This suite's plugins suppress pytest's terminal summary, so there
          # is no counts line to scrape. Derive the totals from the progress
          # line, which is always printed.
          python - "$log" <<'PY'
          import collections, re, sys

          counts: collections.Counter[str] = collections.Counter()
          with open(sys.argv[1], encoding="utf-8", errors="replace") as fh:
              for line in fh:
                  match = re.match(r"^([.sFExX]+)\s+\[\s*\d+%\]", line)
                  if match:
                      counts.update(match.group(1))
          names = {".": "passed", "s": "skipped", "F": "failed", "E": "error", "x": "xfailed", "X": "xpassed"}
          totals = ", ".join(f"{counts[key]} {name}" for key, name in names.items() if counts[key])
          print(f"::error::pytest totals: {totals or 'no progress output to parse'}")
          PY

      - name: Assert the safety invariants CI must never let regress
        run: |
          python - <<'PY'
          from qts.lifecycle.demo_authorization import resolve_demo_execution_policy  # noqa: F401
          from qts.lifecycle.live_gate import check_validated_edge
          from qts.research.catalog import CURRENT_EDGE_STATUS

          ok, detail = check_validated_edge()
          assert CURRENT_EDGE_STATUS == "NO_VALIDATED_EDGE", CURRENT_EDGE_STATUS
          assert ok is False, f"live eligibility must stay blocked while there is no validated edge: {detail}"
          print("live-safety invariant holds:", detail)
          PY
