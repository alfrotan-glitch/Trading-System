name: QTS Gold Windows Research Kit

on:
  push:
    branches: [main]
    paths:
      - "gold_robot/**"
      - "QTS_AUTO_TEST.bat"
      - "QTS_FOUR_FINALISTS.bat"
      - "QTS_PREPARE_STOP_TICKS.bat"
      - "QTS_PREPARE_STOP_TICKS.ps1"
      - "QTS_FINISH_STOP_TICKS.bat"
      - "QTS_FINISH_STOP_TICKS.ps1"
      - "QTS_ONE_CLICK_ROBOT.bat"
      - "QTS_ONE_CLICK_ROBOT.ps1"
      - "QTS_REVISED_COMPARE.bat"
      - "QTS_REVISED_COMPARE.ps1"
      - "QTS_FAST_OPTIMIZE.bat"
      - "QTS_FAST_OPTIMIZE.ps1"
      - "QTS_SHARE_RESULTS.bat"
      - "QTS_POST_STOP_REVIEW.bat"
      - ".github/workflows/gold-research-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-kit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify immutable source fingerprints
        shell: pwsh
        run: |
          python gold_robot/research/update_manifest.py --check
          if ($LASTEXITCODE -ne 0) { throw "Gold source manifest verification failed" }
      - name: Assemble portable Gold kit with no account files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'QTS Gold Customer Kit'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath 'gold_robot' -Destination $stage -Recurse
          foreach ($file in @('QTS_AUTO_TEST.bat','QTS_SHARE_RESULTS.bat','QTS_POST_STOP_REVIEW.bat','QTS_FAST_OPTIMIZE.bat','QTS_FAST_OPTIMIZE.ps1','QTS_FOUR_FINALISTS.bat','QTS_PREPARE_STOP_TICKS.bat','QTS_PREPARE_STOP_TICKS.ps1','QTS_FINISH_STOP_TICKS.bat','QTS_FINISH_STOP_TICKS.ps1','QTS_ONE_CLICK_ROBOT.bat','QTS_ONE_CLICK_ROBOT.ps1','QTS_REVISED_COMPARE.bat','QTS_REVISED_COMPARE.ps1')) {
            Copy-Item -LiteralPath $file -Destination $stage
          }
          @'
          QTS GOLD — WINDOWS RESEARCH KIT (10 STRATEGIES)
          ================================================
          1. Extract the complete ZIP to a writable folder on your Windows desktop.
          2. With WMMarkets MetaTrader 5 installed, double-click:
                  gold_robot\SETUP_MT5_GOLD.bat
             Select the correct MT5 Data Folder and MetaEditor if asked.
             Installation must report zero compiler errors and warnings.
             Never copy .mqh files manually or bypass a failed install.
          3. For faster preliminary screening use QTS_FAST_OPTIMIZE.bat: nine
             M15 styles via local optimization agents, then one M1 scalp.
             This is NOT a full trade-by-trade audit.\n          4. Double-click QTS_AUTO_TEST.bat to run the ten native MT5
             Strategy Tester studies (styles 0-9, M1 for style 9).
             The program does NOT send live-account orders.
          5. For full forensic review of four positive-screen styles,
             run QTS_FOUR_FINALISTS.bat (styles 1,3,7,8 only).
             Native MT5 tests and complete broker deal evidence are required.
          6. Review the saved OPEN_RESULTS report, then optionally run
             QTS_SHARE_RESULTS.bat and QTS_POST_STOP_REVIEW.bat.
          7. ONE-CLICK post-stop research: double-click QTS_ONE_CLICK_ROBOT.bat
             to reuse native MT5 deals, read historical broker bid/ask data,
             replay stop paths and produce the QTS_POST_STOP_REVIEW.zip file.
             The connected MT5 terminal and Python MT5 quote module are needed.
             Missing Python module can be installed automatically.
          8. This is NOT a profitable-edge-certified production robot.
             LIVE REAL-MONEY TRADING IS LOCKED. Broker-specific native
             compile and after-cost, independent testing remain required.
             A synthetic CI check is NOT proof of broker fills or profits.
          
          This package contains no saved broker passwords, user data or
          trading reports. A local MT5 terminal and broker history are required.
          '@ | Set-Content -LiteralPath (Join-Path $stage 'OPEN_FIRST.txt') -Encoding UTF8
          $zip = Join-Path $env:GITHUB_WORKSPACE 'QTS-Gold-Windows-Research-Kit.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Portable kit not created' }
      - name: Test extracted kit in Windows folder with spaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = Join-Path $env:RUNNER_TEMP 'QTS Gold Extracted Acceptance'
          Expand-Archive -LiteralPath 'QTS-Gold-Windows-Research-Kit.zip' -DestinationPath $dst -Force
          Push-Location $dst
          try {
            foreach($file in @('OPEN_FIRST.txt','gold_robot\SETUP_MT5_GOLD.bat','gold_robot\mt5_robot\QTS_Gold_Robot.mq5','gold_robot\mt5_robot\SmcResearch.mqh','gold_robot\mt5_robot\ScalpResearch.mqh','QTS_AUTO_TEST.bat','QTS_SHARE_RESULTS.bat','QTS_POST_STOP_REVIEW.bat','QTS_FAST_OPTIMIZE.bat','QTS_FAST_OPTIMIZE.ps1','QTS_FOUR_FINALISTS.bat','QTS_PREPARE_STOP_TICKS.bat','QTS_PREPARE_STOP_TICKS.ps1','QTS_FINISH_STOP_TICKS.bat','QTS_FINISH_STOP_TICKS.ps1','QTS_ONE_CLICK_ROBOT.bat','QTS_ONE_CLICK_ROBOT.ps1','QTS_REVISED_COMPARE.bat','QTS_REVISED_COMPARE.ps1')) {
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing kit file: $file" }
            }
            python gold_robot/research/update_manifest.py --check
            if ($LASTEXITCODE -ne 0) { throw 'Extracted kit source hash mismatch' }
            $env:QTS_SETUP_VALIDATE_ONLY = '1'
            & $env:ComSpec /d /c 'call "gold_robot\SETUP_MT5_GOLD.bat"'
            if ($LASTEXITCODE -ne 0) { throw "Extracted kit setup path validation failed: $LASTEXITCODE" }
            Write-Host 'PASS: portable kit, complete source manifest and installer paths; no terminal launched'
          } finally {
            Remove-Item Env:QTS_SETUP_VALIDATE_ONLY -ErrorAction SilentlyContinue
            Pop-Location
          }
      - name: Parse read-only bounded stop tick helpers on Windows
        shell: pwsh
        run: |
          foreach($name in @('QTS_PREPARE_STOP_TICKS.ps1', 'QTS_FINISH_STOP_TICKS.ps1', 'QTS_ONE_CLICK_ROBOT.ps1', 'QTS_REVISED_COMPARE.ps1')) {
            $tokens = $null
            $errors = $null
            $file = (Resolve-Path $name).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
            if (@($errors).Count -ne 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "Stop-tick helper PowerShell syntax failed: $name"
            }
          }
          python -m pip install --quiet pytest
          if($LASTEXITCODE -ne 0){ throw 'Could not install Python test runner' }
          python -m pytest -q -o 'addopts=' gold_robot/tests/test_stop_tick_window_export.py gold_robot/tests/test_auto_stop_ticks.py gold_robot/tests/test_stop_failure_paths.py gold_robot/tests/test_revised_v2_contract.py
          if($LASTEXITCODE -ne 0){ throw 'Stop tick plan unit regression failed' }
          Write-Host 'PASS: bounded 120-minute and automatic one-click broker quote research contracts'

      - name: Parse and check local-agent fast-screen script on Windows
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $full = (Resolve-Path 'QTS_FAST_OPTIMIZE.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($full, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            throw 'Fast optimization PowerShell syntax is invalid'
          }
          $text = Get-Content $full -Raw -Encoding UTF8
          foreach ($required in @('EntryStyle=0||0||1||8||Y','Optimization=1',
            'UseRemote=0','UseCloud=0','TesterIgnoreDailyAndPeakStops=false',
            'profitable_edge_validated=$false','full_trade_forensics_complete=$false',
            "RunJob `$config9 'M1 scalp'")) {
            if (-not $text.Contains($required)) { throw "Missing fast screen safety invariant: $required" }
          }
          Write-Host 'PASS: fast screen syntax and static safety gates (MT5 native execution not simulated)'
      - name: Reject missing, duplicated and spoofed MT5 optimization passes
        shell: pwsh
        run: |
          $ok = Join-Path $env:RUNNER_TEMP 'qts-fast-nine-valid.xml'
          $bad = Join-Path $env:RUNNER_TEMP 'qts-fast-eight-only.xml'
          $dup = Join-Path $env:RUNNER_TEMP 'qts-fast-duplicate.xml'
          $header = '<Row><Cell><Data>Pass</Data></Cell><Cell><Data>EntryStyle</Data></Cell></Row>'
          $records = @(0..8 | ForEach-Object { '<Row><Cell><Data>' + ($_+1) + '</Data></Cell><Cell><Data>' + $_ + '</Data></Cell></Row>' })
          $prefix = '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet><Table>'
          $suffix = '</Table></Worksheet></Workbook>'
          [IO.File]::WriteAllText($ok, ($prefix+$header+($records -join '')+$suffix))
          [IO.File]::WriteAllText($bad,($prefix+$header+(@($records | Select-Object -First 8) -join '')+$suffix))
          [IO.File]::WriteAllText($dup,($prefix+$header+(@($records[0..7]+$records[7]) -join '')+$suffix))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File './QTS_FAST_OPTIMIZE.ps1' -ValidateXmlOnly -OptimizationXml $ok
          if($LASTEXITCODE -ne 0){ throw 'Nine-pass XML should validate' }
          foreach($file in @($bad,$dup)){
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File './QTS_FAST_OPTIMIZE.ps1' -ValidateXmlOnly -OptimizationXml $file
            if($LASTEXITCODE -eq 0){ throw "Invalid optimization evidence was accepted: $file" }
          }
          Write-Host 'PASS: only nine distinct native optimization style records validate'
          # Negative tests deliberately return nonzero; clear native exit state after successful assertions.
          $global:LASTEXITCODE = 0
      - name: Verify four-finalist native runner on Windows
        shell: pwsh
        run: |
          $file = (Resolve-Path 'gold_robot/research/RunAutomaticTester.ps1').Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            throw 'Selective runner PowerShell parse failed'
          }
          $body = Get-Content $file -Raw -Encoding UTF8
          foreach ($key in @('OnlyStyles', 'foreach($i in $selectedStyles)',
            'SELECTED_TESTS_FINISHED_REVIEW_REQUIRED', 'SELECTED_TESTS_WITH_EVIDENCE_GAPS')) {
            if (-not $body.Contains($key)) { throw "Selective runner missing invariant $key" }
          }
          $package = Get-Content 'gold_robot/research/PackTradeEvidence.ps1' -Raw
          if (-not $package.Contains('foreach($i in $requiredStyles)')) {
            throw 'Evidence packager has old hardcoded style range'
          }
          $bat = Get-Content -LiteralPath 'QTS_FOUR_FINALISTS.bat' -Raw
          if (-not $bat.Contains('-OnlyStyles "1,3,7,8"')) { throw 'Four styles were not correctly selected' }
          Write-Host 'PASS: selective native tester parser and four-style evidence routing'
      - uses: actions/upload-artifact@v4
        with:
          name: QTS-Gold-Windows-Research-Kit
          path: QTS-Gold-Windows-Research-Kit.zip
          if-no-files-found: error
          retention-days: 14
