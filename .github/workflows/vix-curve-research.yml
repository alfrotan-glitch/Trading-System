name: QTS VIX Curve Research

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vix-curve-research.yml"
      - "scripts/edgelab_vix_curve_run.py"
      - "scripts/fetch_cboe_vix_curve.py"
      - "src/qts/research/edgelab/vix_curve.py"
      - "tests/unit/test_edgelab_vix_curve.py"

permissions:
  contents: read

concurrency:
  group: vix-curve-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned application dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify causal VIX and session code
        run: |
          ruff check src/qts/research/edgelab/vix_curve.py tests/unit/test_edgelab_vix_curve.py
          pytest -q tests/unit/test_edgelab_vix_curve.py tests/unit/test_edgelab_intraday.py tests/unit/test_edgelab_regime.py
      - name: Acquire published Cboe volatility-curve history
        run: python scripts/fetch_cboe_vix_curve.py
      - name: Download pinned historical XAUUSD M15 bars
        run: |
          curl --fail --location --retry 3 --max-time 240 \
            --output /tmp/qts_basemax.tgz \
            https://codeload.github.com/BaseMax/XAUUSD-LSTM/tar.gz/43f4177e701fdf3643cc02413e4337932af57401
          python - <<'PY'
          import shutil
          import tarfile
          from pathlib import Path

          destination = Path("data/raw/longhistory")
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open("/tmp/qts_basemax.tgz", "r:gz") as archive:
              found = [m for m in archive.getmembers() if m.isfile() and m.name.endswith("/XAU_15m_data.csv")]
              if len(found) != 1:
                  raise RuntimeError(f"Expected one source file, found {len(found)}")
              member = found[0]
              if not member.name.startswith("XAUUSD-LSTM-"):
                  raise RuntimeError(f"Unexpected archive prefix: {member.name}")
              destination_file = destination / member.name
              destination_file.parent.mkdir(parents=True, exist_ok=True)
              src = archive.extractfile(member)
              if src is None:
                  raise RuntimeError("Pinned historical data unavailable")
              with src, destination_file.open("wb") as output:
                  shutil.copyfileobj(src, output)
              print(f"Loaded pinned M15 data: {destination_file}, {member.size} bytes")
          PY
      - name: Execute preregistered VIX curve study on tradable M15 closes
        run: python scripts/edgelab_vix_curve_run.py --gold-source basemax
      - name: Publish evidence only (no raw market data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qts-vix-curve-research-${{ github.run_id }}
          path: |
            data/research/experiments/vix_curve_*.json
            data/raw/edgelab/cboe_vix_curve/source_manifest.json
          if-no-files-found: warn
          retention-days: 30
