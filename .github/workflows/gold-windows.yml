name: QTS Gold Windows Installer and Report Smoke
on:
  push:
    branches: [main]
    paths:
      - "START_HERE.bat"
      - "gold_robot/**"
      - ".github/workflows/gold-windows.yml"
  pull_request:
    paths:
      - "START_HERE.bat"
      - "gold_robot/**"
      - ".github/workflows/gold-windows.yml"
permissions:
  contents: read
jobs:
  windows-onboarding:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Verify clean source manifest on Windows
        shell: pwsh
        run: |
          $m = Get-Content gold_robot/docs/SOURCE_CHECKSUMS.json -Raw | ConvertFrom-Json
          foreach ($f in $m.sha256_files) {
            $path = Join-Path gold_robot ($f.path.Replace('/','\'))
            if (-not (Test-Path -LiteralPath $path)) { throw "Manifest source missing: $path" }
            $file = Get-Item -LiteralPath $path
            if ($file.Length -ne $f.bytes) { throw "Manifest file size mismatch: $path" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($hash -ne $f.sha256) { throw "Manifest sha mismatch: $path" }
          }
          if (-not (Test-Path START_HERE.bat)) { throw "Windows launcher missing" }
          if (-not (Test-Path gold_robot/MAKE_REPORT.bat)) { throw "Report launcher missing" }
          Write-Host "Canonical Windows sources: OK"
      - name: Invoke root launcher through Windows cmd without touching MT5
        shell: pwsh
        run: |
          $rootLauncher = (Resolve-Path 'START_HERE.bat').Path
          & $env:ComSpec /d /c ('call "{0}" /verify-setup' -f $rootLauncher)
          if ($LASTEXITCODE -ne 0) { throw "Windows cmd launcher path failed: $LASTEXITCODE" }
      - name: Generate and verify four isolated MT5 tester presets
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'qts-tester-presets'
          ./gold_robot/research/MakeTesterPresets.ps1 -OutputDirectory $dir
          $sets = @(Get-ChildItem -LiteralPath $dir -Filter '*.set')
          if ($sets.Count -ne 4) { throw 'Four strategy tester profiles required' }
          $expected = @('0','1','2','3')
          foreach ($set in $sets) {
            $contents = Get-Content -LiteralPath $set.FullName -Encoding Unicode
            $style = @($contents | Where-Object { $_ -match '^EntryStyle=' })
            if ($style.Count -ne 1) { throw "Missing entry style in $($set.Name)" }
            $actual = $style[0].Split('=')[1]
            if ($actual -notin $expected) { throw "Invalid entry style $actual" }
            $expected = @($expected | Where-Object { $_ -ne $actual })
            foreach ($required in @('EnableDemoOrders=true',
                                    'EnableDemoForwardOrders=false',
                                    'TesterIgnoreDailyAndPeakStops=true',
                                    'RiskPerTradePct=0.50')) {
              if ($required -notin $contents) { throw "Unsafe/inconsistent preset $($set.Name): $required" }
            }
            if (@($contents | Where-Object { $_ -match '^EnableDemoForwardOrders=true' }).Count -gt 0) {
              throw "Connected demo permission leaked into tester preset"
            }
          }
          if ($expected.Count -ne 0) { throw "Missing entry styles" }
          Write-Host 'Four MT5 tester presets validated without broker access.'
      - name: Compare four synthetic MT5 native tester reports without broker access
        shell: pwsh
        run: |
          $native = Join-Path $env:RUNNER_TEMP 'qts-native-reports'
          $out = Join-Path $env:RUNNER_TEMP 'qts-native-comparison'
          New-Item -ItemType Directory -Path $native,$out -Force | Out-Null
          for ($i = 0; $i -lt 4; $i++) {
            $net = (-10 + $i * 8)
            $html = '<html><table><tr><td>Total Net Profit:</td><td>' + $net +
                    '</td></tr><tr><td>Profit Factor:</td><td>1.10</td></tr>' +
                    '<tr><td>Total Trades:</td><td>25</td></tr>' +
                    '<tr><td>Equity Drawdown Maximal:</td><td>90.00 (3.0%)</td></tr></table></html>'
            [IO.File]::WriteAllText((Join-Path $native ("QTS_{0}.htm" -f $i)),
                                    $html, [Text.Encoding]::Unicode)
          }
          ./gold_robot/research/CompareMT5Reports.ps1 -ReportDirectory $native -OutputDirectory $out -NoOpen
          $json = @(Get-ChildItem -LiteralPath $out -Filter '*.json')
          if ($json.Count -ne 1) { throw 'Missing native comparison JSON' }
          $r = Get-Content -LiteralPath $json[0].FullName -Raw | ConvertFrom-Json
          if ($r.reports_parsed -ne 4 -or $r.validated_edge -ne $false -or $r.live -ne 'LOCKED') {
            throw 'Native comparison has incorrect status or permissions'
          }
          if (@($r.results).Count -ne 4) { throw 'Native comparison missing strategies' }
          Write-Host 'Read-only 4-arm MT5 native comparison: PASS'
      - name: Simulate clean and blocked MT5 broker reports (no trading)
        shell: pwsh
        run: ./gold_robot/tests/windows_report_smoke.ps1
