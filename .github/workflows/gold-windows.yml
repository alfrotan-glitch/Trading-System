name: QTS Gold Windows Installer and Report Smoke
on:
  push:
    branches: [main]
    paths:
      - "START_HERE.bat"
      - "QTS_AUTO_TEST.bat"
      - "QTS_POST_STOP_REVIEW.bat"
      - "gold_robot/**"
      - ".github/workflows/gold-windows.yml"
  pull_request:
    paths:
      - "START_HERE.bat"
      - "QTS_AUTO_TEST.bat"
      - "QTS_POST_STOP_REVIEW.bat"
      - "gold_robot/**"
      - ".github/workflows/gold-windows.yml"
permissions:
  contents: read
jobs:
  windows-onboarding:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify clean source manifest on Windows
        shell: pwsh
        run: |
          $m = Get-Content gold_robot/docs/SOURCE_CHECKSUMS.json -Raw | ConvertFrom-Json
          foreach ($f in $m.sha256_files) {
            $path = Join-Path gold_robot ($f.path.Replace('/','\'))
            if (-not (Test-Path -LiteralPath $path)) { throw "Manifest source missing: $path" }
            $file = Get-Item -LiteralPath $path
            if ($file.Length -ne $f.bytes) { throw "Manifest file size mismatch: $path" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($hash -ne $f.sha256) { throw "Manifest sha mismatch: $path" }
          }
          if (-not (Test-Path START_HERE.bat)) { throw "Windows launcher missing" }
          if (-not (Test-Path QTS_POST_STOP_REVIEW.bat)) { throw "Read-only stop review launcher missing" }
          if (-not (Test-Path gold_robot/MAKE_REPORT.bat)) { throw "Report launcher missing" }
          Write-Host "Canonical Windows sources: OK"
      - name: Invoke root launcher through Windows cmd without touching MT5
        shell: pwsh
        run: |
          $rootLauncher = (Resolve-Path 'START_HERE.bat').Path
          & $env:ComSpec /d /c ('call "{0}" /verify-setup' -f $rootLauncher)
          if ($LASTEXITCODE -ne 0) { throw "Windows cmd launcher path failed: $LASTEXITCODE" }
      - name: Verify menu sub-launchers through real relative Windows CMD calls
        shell: pwsh
        run: |
          # Mirrors START_HERE menu calling gold_robot\*.bat from repository root.
          # The working directory must not double-prefix gold_robot after cd /d.
          $env:QTS_NO_OPEN = '1'
          & $env:ComSpec /d /c 'call "gold_robot\MAKE_REPORT.bat"'
          if ($LASTEXITCODE -ne 0) { throw "Root menu report launcher failed: $LASTEXITCODE" }
          $reports = @(Get-ChildItem gold_robot/reports_local -Filter 'QTS_Gold_Readiness_*.json')
          if ($reports.Count -lt 1) { throw 'Report not written to expected gold_robot/reports_local path' }
          & $env:ComSpec /d /c 'call "gold_robot\MAKE_TEST_PRESETS.bat"'
          if ($LASTEXITCODE -ne 0) { throw "Root menu tester preset launcher failed: $LASTEXITCODE" }
          $presets = @(Get-ChildItem gold_robot/reports_local/tester_presets -Filter '*.set')
          if ($presets.Count -ne 8) { throw 'Launcher did not produce eight tester presets in correct directory' }
          & $env:ComSpec /d /c 'call "gold_robot\MAKE_COMPARISON.bat"'
          if ($LASTEXITCODE -ne 0) { throw "Root menu comparison launcher failed: $LASTEXITCODE" }
          $comparisons = @(Get-ChildItem gold_robot/reports_local -Filter 'QTS_Gold_Comparison_*.json')
          if ($comparisons.Count -lt 1) { throw 'Comparison report not written to expected location' }
          if (Test-Path gold_robot/gold_robot) { throw 'Incorrect duplicated gold_robot path was created' }
          Write-Host 'Windows nested relative BAT menu launchers: PASS'

      - name: Verify user-friendly offline MT5 log review and HTML escaping
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'qts saved tester logs'
          New-Item -Path $folder -ItemType Directory -Force | Out-Null
          $log = Join-Path $folder 'QTS_0.htm.log'
          $lines = @(
            'testing of Experts\QTS_Gold_Robot.ex5 from 2026.01.01 00:00 to 2026.02.05 00:00 started with inputs:',
            'Tester  EntryStyle=2',
            'Tester  RiskPerTradePct=0.50',
            'QTS ENTRY AUDIT bar=2026.01.02 reason=<script>alert(1)</script>',
            'QTS broker deal: deal=9 entry=0 volume=0.01 price=4000.00 gross=0.00 commission=0.00 swap=0.00 fee=0.00 net=0.00',
            'QTS broker deal: deal=10 entry=1 volume=0.01 price=4001.00 gross=1.00 commission=0.00 swap=0.00 fee=0.00 net=1.00',
            'final balance 3001.00 USD',
            'Test passed in 0:00:03'
          )
          [IO.File]::WriteAllLines($log, $lines, [Text.Encoding]::UTF8)
          $jsonPath = Join-Path $folder 'audit.json'
          $htmlPath = Join-Path $folder 'audit.html'
          python gold_robot/research/audit_mt5_logs.py --directory $folder --output $jsonPath --html-output $htmlPath
          if ($LASTEXITCODE -ne 0) { throw 'Local MT5 log analysis failed' }
          $data = Get-Content $jsonPath -Raw | ConvertFrom-Json
          $html = Get-Content $htmlPath -Raw
          if ($data.filename_mismatches -ne 1 -or $data.sessions[0].entry_style -ne 2 -or
              $data.sessions[0].eligible_for_comparison -ne $false -or
              $html -notmatch 'WRONG_FILENAME' -or
              $html -notmatch '&lt;script&gt;' -or $html -match '<script>alert') {
            throw 'Mislabeled-file detection or HTML escaping failed'
          }
          $renamed = Join-Path $folder 'gold tester session.txt'
          [IO.File]::WriteAllLines($renamed,$lines,[Text.Encoding]::Unicode)
          $native = Join-Path $folder 'saved gold report.html'
          [IO.File]::WriteAllText($native,'<html>MetaTrader 5 / Total Net Profit</html>')
          python gold_robot/research/audit_mt5_logs.py --directory $folder --output $jsonPath --html-output $htmlPath
          if ($LASTEXITCODE -ne 0) { throw 'Content-based discovery failed' }
          $found = Get-Content $jsonPath -Raw | ConvertFrom-Json
          if ($found.file_search.status -ne 'LOGS_FOUND' -or
              $found.file_search.log_files_found -ne 2 -or
              @($found.file_search.native_html_reports_found).Count -ne 1 -or
              $found.complete_unique -ne 1) {
            throw 'Renamed log discovery, duplicate detection or native HTML routing failed'
          }
          $empty = Join-Path $env:RUNNER_TEMP 'qts no saved logs'
          New-Item -Path $empty -ItemType Directory -Force | Out-Null
          python gold_robot/research/audit_mt5_logs.py --directory $empty --output $jsonPath --html-output $htmlPath
          if ($LASTEXITCODE -ne 0) { throw 'No saved reports should be a friendly report, not a crash' }
          $none = Get-Content $jsonPath -Raw | ConvertFrom-Json
          $emptyHtml = Get-Content $htmlPath -Raw
          if ($none.file_search.status -ne 'NO_AGENT_LOGS_FOUND' -or
              $none.file_search.log_files_found -ne 0 -or
              $emptyHtml -notmatch 'NO_AGENT_LOGS_FOUND') {
            throw 'Empty-file UX did not generate clear diagnostics'
          }
          Write-Host 'Windows native offline log review: PASS'
      - name: Verify identical MT5 and compiler selection for both installers
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'QTS MT5 Folder With Spaces'
          $mql5 = Join-Path $fake 'MQL5'
          foreach ($dir in @('Experts','Scripts','Include','Indicators')) {
            New-Item -ItemType Directory -Path (Join-Path $mql5 $dir) -Force | Out-Null
          }
          $editor = Join-Path $fake 'metaeditor64.exe'
          [IO.File]::WriteAllText($editor, 'TEST-ONLY NOT A REAL EDITOR')
          ./gold_robot/mt5_robot/Install_MT5_Canonical.ps1 -TerminalDataFolder $fake -MetaEditorPath $editor -ValidateOnly
          if (-not $?) { throw 'Single MT5 terminal selection validation failed' }
          $source = Get-Content gold_robot/mt5_robot/Install_MT5_Canonical.ps1 -Raw
          foreach ($required in @('RunInstaller $robotScript', 'RunInstaller $brokerScript',
              '-TerminalDataFolder "{1}" -MetaEditorPath "{2}"', '$mql5,$editor')) {
            if (-not $source.Contains($required)) { throw "Missing unified target propagation: $required" }
          }
          $bad = Join-Path $fake 'Invalid Terminal'
          $failed = $false
          try {
            ./gold_robot/mt5_robot/Install_MT5_Canonical.ps1 -TerminalDataFolder $bad -MetaEditorPath $editor -ValidateOnly
          } catch { $failed = $true }
          if (-not $failed) { throw 'Malformed target was not rejected' }
          Write-Host 'Single-target MT5 safety and malformed-folder refusal: PASS'
      - name: Prepare one-click native MT5 jobs in isolation (never launches terminal)
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'QTS MT5 Auto Folder With Spaces'
          $install = Join-Path $fake 'terminal'
          $data = Join-Path $fake 'data'
          $experts = Join-Path $data 'MQL5\Experts'
          New-Item -ItemType Directory -Path $install,$experts,(Join-Path $data 'MQL5\Profiles') -Force | Out-Null
          # Simulate a build that resolves Tester presets via installation MQL5.
          New-Item -ItemType Directory -Path (Join-Path $install 'MQL5\Profiles') -Force | Out-Null
          $exe = Join-Path $install 'terminal64.exe'
          [IO.File]::WriteAllText($exe,'TEST-ONLY FAKE TERMINAL - NEVER EXECUTE')
          foreach($name in @('QTS_Gold_Robot.mq5','ExecutionPolicy.mqh','StructureResearch.mqh','OpportunityResearch.mqh','AdaptiveResearch.mqh')){
            Copy-Item -LiteralPath (Join-Path gold_robot/mt5_robot $name) -Destination (Join-Path $experts $name)
          }
          $binary = Join-Path $experts 'QTS_Gold_Robot.ex5'
          [IO.File]::WriteAllBytes($binary,(New-Object byte[] 4096))
          $out = Join-Path $env:RUNNER_TEMP 'QTS automatic research test'
          ./gold_robot/research/RunAutomaticTester.ps1 -TerminalExe $exe -TerminalDataFolder $data -OutputDirectory $out -FromDate '2026.04.01' -ToDate '2026.09.01' -PrepareOnly -NoOpen
          if ($LASTEXITCODE -ne 0) { throw "One-click configuration preflight failed" }
          $json = Get-Content (Join-Path $out 'OPEN_RESULTS.json') -Raw | ConvertFrom-Json
          if ($json.state -ne 'PREPARED_ONLY' -or $json.live -ne 'LOCKED' -or
              $json.validated_edge -ne $false -or $json.real_money_orders -ne $false) {
            throw 'Preparation did not preserve simulation-only fail-closed state'
          }
          $configFolder = Join-Path $out 'configs'
          $configs = @(Get-ChildItem -LiteralPath $configFolder -Filter '*.ini')
          if ($configs.Count -ne 8) { throw 'Expected exactly eight auto-generated MT5 ini files' }
          for($i=0;$i -lt 8;$i++){
            $ini = Get-Content (Join-Path $configFolder ("style_$i.ini")) -Encoding Unicode
            foreach($required in @('Expert=QTS_Gold_Robot.ex5','Symbol=XAUUSD@','Period=M15',
                                    'Model=4','Deposit=3000','AllowLiveTrading=0','Enabled=0',
                                    'UseCloud=0','UseRemote=0','ShutdownTerminal=1',
                                    'Optimization=0','ForwardMode=0','FromDate=2026.04.01',
                                    'ToDate=2026.09.01')) {
              if ($required -notin $ini) { throw "Tester configuration $i missing: $required" }
            }
            $parameter = @($ini | Where-Object {$_ -match '^ExpertParameters='})
            if ($parameter.Count -ne 1) { throw "Tester profile path missing for $i" }
            $setName = $parameter[0].Split('=')[1]
            $setFile = Join-Path $data ('MQL5\Profiles\Tester\'+$setName)
            if(-not (Test-Path $setFile)) { throw "Tester profile not copied: $setFile" }
            $installCopy = Join-Path $install ('MQL5\Profiles\Tester\'+$setName)
            if (-not (Test-Path $installCopy) -or
                (Get-FileHash $installCopy).Hash -ne (Get-FileHash $setFile).Hash) {
              throw "Alternate installation-folder .set profile differs from data-folder profile"
            }
            $contents = Get-Content $setFile -Encoding Unicode
            foreach($required in @(('EntryStyle='+$i),'EnableDemoOrders=true',
                                    'EnableDemoForwardOrders=false',
                                    'TesterIgnoreDailyAndPeakStops=false',
                                    'RiskPerTradePct=0.50')) {
              if($required -notin $contents) { throw "Unsafe or missing tester input: $required" }
            }
          }
          if(-not (Test-Path (Join-Path $out 'OPEN_RESULTS.html'))) {
            throw 'One-click report shell was not produced'
          }
          Write-Host 'Eight native tester configurations prepared; zero MT5 launches/orders: PASS'
      - name: Generate and verify eight isolated MT5 tester presets
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'qts-tester-presets'
          ./gold_robot/research/MakeTesterPresets.ps1 -OutputDirectory $dir
          $sets = @(Get-ChildItem -LiteralPath $dir -Filter '*.set')
          if ($sets.Count -ne 8) { throw 'Eight strategy tester profiles required' }
          $expected = @('0','1','2','3','4','5','6','7')
          foreach ($set in $sets) {
            $contents = Get-Content -LiteralPath $set.FullName -Encoding Unicode
            $style = @($contents | Where-Object { $_ -match '^EntryStyle=' })
            if ($style.Count -ne 1) { throw "Missing entry style in $($set.Name)" }
            $actual = $style[0].Split('=')[1]
            if ($actual -notin $expected) { throw "Invalid entry style $actual" }
            $expected = @($expected | Where-Object { $_ -ne $actual })
            foreach ($required in @('EnableDemoOrders=true',
                                    'EnableDemoForwardOrders=false',
                                    'TesterIgnoreDailyAndPeakStops=true',
                                    'RiskPerTradePct=0.50')) {
              if ($required -notin $contents) { throw "Unsafe/inconsistent preset $($set.Name): $required" }
            }
            if (@($contents | Where-Object { $_ -match '^EnableDemoForwardOrders=true' }).Count -gt 0) {
              throw "Connected demo permission leaked into tester preset"
            }
          }
          if ($expected.Count -ne 0) { throw "Missing entry styles" }
          $safeSets = @(Get-ChildItem -LiteralPath (Join-Path $dir 'safety_on') -Filter '*.set')
          if ($safeSets.Count -ne 8) { throw 'Eight safety-on research profiles required' }
          $safeExpected = @('0','1','2','3','4','5','6','7')
          foreach ($set in $safeSets) {
            $lines = Get-Content -LiteralPath $set.FullName -Encoding Unicode
            $style = @($lines | Where-Object { $_ -match '^EntryStyle=' })
            if ($style.Count -ne 1) { throw "Missing safety-on style in $($set.Name)" }
            $value = $style[0].Split('=')[1]
            if ($value -notin $safeExpected) { throw 'Invalid or duplicate safety-on style' }
            $safeExpected = @($safeExpected | Where-Object { $_ -ne $value })
            foreach ($required in @('EnableDemoOrders=true',
                                    'EnableDemoForwardOrders=false',
                                    'TesterIgnoreDailyAndPeakStops=false',
                                    'RiskPerTradePct=0.50')) {
              if ($required -notin $lines) { throw "Unsafe safety-on preset: $($set.Name) missing $required" }
            }
          }
          if ($safeExpected.Count -ne 0) { throw 'Safety-on entry style coverage incomplete' }
          Write-Host 'Eight opportunity-census and eight safety-on MT5 tester presets verified.'
      - name: Compare eight synthetic MT5 native tester reports without broker access
        shell: pwsh
        run: |
          $native = Join-Path $env:RUNNER_TEMP 'qts-native-reports'
          $out = Join-Path $env:RUNNER_TEMP 'qts-native-comparison'
          New-Item -ItemType Directory -Path $native,$out -Force | Out-Null
          for ($i = 0; $i -lt 8; $i++) {
            $net = (-10 + $i * 8)
            $html = '<html><table><tr><td>Inputs:</td><td>EntryStyle=' + $i + '</td></tr>' +
                    '<tr><td>Total Net Profit:</td><td>' + $net +
                    '</td></tr><tr><td>Profit Factor:</td><td>1.10</td></tr>' +
                    '<tr><td>Total Trades:</td><td>25</td></tr>' +
                    '<tr><td>Equity Drawdown Maximal:</td><td>90.00 (3.0%)</td></tr></table></html>'
            [IO.File]::WriteAllText((Join-Path $native ("QTS_{0}.htm" -f $i)),
                                    $html, [Text.Encoding]::Unicode)
          }
          ./gold_robot/research/CompareMT5Reports.ps1 -ReportDirectory $native -OutputDirectory $out -NoOpen
          $json = @(Get-ChildItem -LiteralPath $out -Filter '*.json')
          if ($json.Count -ne 1) { throw 'Missing native comparison JSON' }
          $r = Get-Content -LiteralPath $json[0].FullName -Raw | ConvertFrom-Json
          if ($r.reports_parsed -ne 8 -or $r.validated_edge -ne $false -or $r.live -ne 'LOCKED' -or $r.comparison_approved -ne $false -or $r.periods_and_costs_verified -ne $false) {
            throw 'Native comparison has incorrect status or permissions'
          }
          if (@($r.results).Count -ne 8) { throw 'Native comparison missing strategies' }
          Write-Host 'Read-only 8-arm MT5 native comparison: PASS'
          $path2 = Join-Path $native 'QTS_2.htm'
          $report2 = [IO.File]::ReadAllText($path2)
          [IO.File]::WriteAllText($path2,
            $report2.Replace('EntryStyle=2','EntryStyle=3'),[Text.Encoding]::Unicode)
          ./gold_robot/research/CompareMT5Reports.ps1 -ReportDirectory $native -OutputDirectory $out -NoOpen
          $badStyle = Get-ChildItem -LiteralPath $out -Filter '*.json' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $wrong = Get-Content -LiteralPath $badStyle.FullName -Raw | ConvertFrom-Json
          if ($wrong.reports_parsed -ne 7 -or $wrong.results[2].state -ne 'INVALID' -or
              $wrong.results[2].message -notlike '*EntryStyle mismatch*') {
            throw 'Mislabeled native HTML report was counted as the expected strategy'
          }
          [IO.File]::WriteAllText($path2,
            $report2.Replace('EntryStyle=2','EntryStyle=unreported'),[Text.Encoding]::Unicode)
          ./gold_robot/research/CompareMT5Reports.ps1 -ReportDirectory $native -OutputDirectory $out -NoOpen
          $missingStyle = Get-ChildItem -LiteralPath $out -Filter '*.json' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $unverified = Get-Content -LiteralPath $missingStyle.FullName -Raw | ConvertFrom-Json
          if ($unverified.reports_parsed -ne 7 -or $unverified.unverified_style -ne 1 -or
              $unverified.results[2].state -ne 'UNVERIFIED_STYLE') {
            throw 'HTML lacking EntryStyle was counted as verified research evidence'
          }
          Write-Host 'Mislabeled/missing EntryStyle evidence: PASS'
          [IO.File]::WriteAllText($path2,$report2,[Text.Encoding]::Unicode)
          $bad = Join-Path $native 'QTS_0.htm'
          [IO.File]::WriteAllText($bad,
            "CS`t0`t00:00:01.000`tStartup`tMetaTester 5 build 6230",
            [Text.Encoding]::Unicode)
          Remove-Item -LiteralPath (Join-Path $native 'QTS_1.htm')
          [IO.File]::WriteAllText((Join-Path $native 'QTS_1.htm.log'),
            "CS`t0`t00:00:01.000`tStartup`tMetaTester 5 build 6230",
            [Text.Encoding]::Unicode)
          ./gold_robot/research/CompareMT5Reports.ps1 -ReportDirectory $native -OutputDirectory $out -NoOpen
          $latest = Get-ChildItem -LiteralPath $out -Filter '*.json' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $badResult = Get-Content -LiteralPath $latest.FullName -Raw | ConvertFrom-Json
          if ($badResult.reports_parsed -ne 6 -or
              $badResult.results[0].state -ne 'LOG_ONLY' -or
              $badResult.results[1].state -ne 'LOG_ONLY') {
            throw 'Mislabeled MT5 logs were accepted as finished HTML reports'
          }
          Write-Host 'Agent logs correctly refused as backtest HTML: PASS'
      - name: Verify independent per-position SL/TP forensics
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'qts sample broker deals'
          New-Item -Path $folder -ItemType Directory -Force | Out-Null
          $header = 'position_id;deal_id;order_id;entry;reason;type;time_msc;volume;price;sl;tp;gross;commission;swap;fee'
          $deals = @(
            $header,
            '100;1;91;DEAL_ENTRY_IN;DEAL_REASON_EXPERT;DEAL_TYPE_BUY;100000;0.01;4000;3998;4002;0;-0.03;0;0',
            '100;2;92;DEAL_ENTRY_OUT;DEAL_REASON_SL;DEAL_TYPE_SELL;280000;0.01;3997.9;3998;4002;-2.10;-0.03;0;0',
            '200;3;93;DEAL_ENTRY_IN;DEAL_REASON_EXPERT;DEAL_TYPE_SELL;390000;0.01;4010;4012;4008;0;-0.03;0;0',
            '200;4;94;DEAL_ENTRY_OUT;DEAL_REASON_TP;DEAL_TYPE_BUY;510000;0.01;4008;4012;4008;2.0;-0.03;0;0'
          )
          $path = Join-Path $folder 'QTS_4_trades.csv'
          [IO.File]::WriteAllLines($path,$deals,[Text.Encoding]::ASCII)
          $output = Join-Path $env:RUNNER_TEMP 'qts position forensics results'
          ./gold_robot/research/BuildTradeForensics.ps1 -InputDirectory $folder -OutputDirectory $output -NoOpen
          if (-not (Test-Path (Join-Path $output 'QTS_TRADE_BY_TRADE.json'))) { throw 'Position-level forensic parser failed to produce JSON' }
          $j = Get-Content (Join-Path $output 'QTS_TRADE_BY_TRADE.json') -Raw | ConvertFrom-Json
          $trades = @($j.trades)
          if ($trades.Count -ne 2) { throw 'Trade count must group fill and exit by position' }
          $sl = @($trades | Where-Object { $_.exit_reason -eq 'DEAL_REASON_SL' })
          $tp = @($trades | Where-Object { $_.exit_reason -eq 'DEAL_REASON_TP' })
          if ($sl.Count -ne 1 -or $tp.Count -ne 1 -or
              $sl[0].position_id -ne '100' -or $tp[0].position_id -ne '200' -or
              $sl[0].exit_adverse_slippage_price -lt 0.0999 -or
              $sl[0].net_usd -ge 0 -or $tp[0].net_usd -le 0 -or
              $j.edge_validated -ne $false -or $j.status -ne 'EVIDENCE_GAPS_NO_GO') {
            throw 'SL / TP deal identity or slip calculation incorrect'
          }
          $headerExtended = $header + ';setup_reason'
          $multi = @(
            $headerExtended,
            '300;5;95;DEAL_ENTRY_IN;DEAL_REASON_EXPERT;DEAL_TYPE_BUY;600000;0.02;4000;3998;4002;0;-0.04;0;0;QTS RANGE REJECT',
            '300;6;96;DEAL_ENTRY_OUT;DEAL_REASON_TP;DEAL_TYPE_SELL;700000;0.01;4002;3998;4002;2;-0.02;0;0;',
            '300;7;97;DEAL_ENTRY_OUT;DEAL_REASON_SL;DEAL_TYPE_SELL;900000;0.01;3997.95;3998;4002;-2.05;-0.02;0;0;'
          )
          [IO.File]::WriteAllLines((Join-Path $folder 'QTS_5_trades.csv'),$multi,[Text.Encoding]::ASCII)
          ./gold_robot/research/BuildTradeForensics.ps1 -InputDirectory $folder -OutputDirectory $output -NoOpen
          $detail = Get-Content (Join-Path $output 'QTS_TRADE_BY_TRADE.json') -Raw | ConvertFrom-Json
          $multiTrade = @($detail.trades | Where-Object { $_.position_id -eq '300' })
          if($multiTrade.Count -ne 1 -or $multiTrade[0].setup_reason -ne 'QTS RANGE REJECT' -or
             $multiTrade[0].status -ne 'COMPLETE_MULTI_EXIT' -or
             $multiTrade[0].exit_reason -ne 'MIXED_EXIT_REASONS' -or
             @($multiTrade[0].exit_legs).Count -ne 2) {
            throw 'A partial TP followed by SL was incorrectly reduced to the last exit'
          }
          Write-Host 'Individual MT5 deal SL/TP forensics: PASS (no broker order)'
      - name: Package local evidence without native account HTML or terminal logs
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'gold_robot\reports_local\auto_runs'
          $run = Join-Path $root '20261030_083000'
          $native = Join-Path $run 'native'
          New-Item -ItemType Directory -Path $native -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $run 'OPEN_RESULTS.json'),'{"status":"EVIDENCE_GAPS_NO_GO"}')
          [IO.File]::WriteAllText((Join-Path $run 'QTS_TRADE_BY_TRADE.json'),'{"trades":[{"position_id":"123"}]}')
          [IO.File]::WriteAllText((Join-Path $native 'QTS_1_trades.csv'),'position_id;deal_id')
          [IO.File]::WriteAllText((Join-Path $native 'QTS_1.htm'),'<html>PRIVATE-ACCOUNT-DO-NOT-EXPORT</html>')
          [IO.File]::WriteAllText((Join-Path $run 'terminal.log'),'PRIVATE-ACCOUNT-DO-NOT-EXPORT')
          ./gold_robot/research/PackTradeEvidence.ps1 -RunDirectory $run -NoOpen
          $zip = Join-Path $run 'QTS_SHARE_RESULTS.zip'
          if(-not (Test-Path -LiteralPath $zip)){throw 'Local evidence zip not produced'}
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($z.Entries | ForEach-Object {$_.FullName})
            if(@($names).Count -ne 4 -or
               'README_EVIDENCE.txt' -notin $names -or
               'OPEN_RESULTS.json' -notin $names -or
               'QTS_TRADE_BY_TRADE.json' -notin $names -or
               'native/QTS_1_trades.csv' -notin $names) {
              throw 'Evidence package lacks correct allowlist'
            }
            if(@($names | Where-Object { $_.EndsWith('.htm') -or $_.EndsWith('.log') }).Count) {
              throw 'Private native HTML or log was included in handoff'
            }
            $readme=$z.GetEntry('README_EVIDENCE.txt')
            $reader=[IO.StreamReader]::new($readme.Open())
            try{$txt=$reader.ReadToEnd()}finally{$reader.Dispose()}
            if($txt -notmatch 'INCOMPLETE_FORENSIC_EVIDENCE' -or
               $txt -notmatch 'QTS_0_trades.csv') {
              throw 'Missing deal evidence was not disclosed'
            }
          } finally {$z.Dispose()}
          Write-Host 'Trade-forensic local evidence ZIP allowlist and incomplete status: PASS'
      - name: Attribute adaptive broker-deal positions to actually selected family
        shell: pwsh
        run: |
          $r=Join-Path $env:RUNNER_TEMP 'qts adaptive position attribution'
          New-Item -ItemType Directory -Path $r -Force | Out-Null
          $a=@{
            status='IMPORTED_FOR_REVIEW'
            trades=@(
              @{style=7;position_id='a';setup_reason='QTS RETEST LIMIT DEMO';status='COMPLETE';net_usd=10.0;charges_usd=0.0;exit_reason='DEAL_REASON_TP';exit_adverse_slippage_price=0.0;minutes_held=12;exit_legs=@(@{time_msc='1775000000000'})},
              @{style=7;position_id='b';setup_reason='QTS SWEEP RECLAIM';status='COMPLETE';net_usd=-12.5;charges_usd=0.0;exit_reason='DEAL_REASON_SL';exit_adverse_slippage_price=0.3;minutes_held=4;exit_legs=@(@{time_msc='1775100000000'})},
              @{style=0;position_id='not-adaptive';setup_reason='QTS OLD-SL LIMIT DEMO';status='COMPLETE';net_usd=1000.0;charges_usd=0.0;exit_reason='DEAL_REASON_TP';exit_adverse_slippage_price=0.0;minutes_held=3;exit_legs=@(@{time_msc='1775100000000'})}
            )
          }
          $a | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $r 'QTS_TRADE_BY_TRADE.json')
          $c=@{results=@(@{style=7;state='PARSED';trades=2;net_usd=-2.5;profit_factor=0.8;maximal_equity_drawdown=25.0})}
          $c | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $r 'QTS_Gold_Comparison_Test.json')
          ./gold_robot/research/ExplainAdaptiveRouter.ps1 -RunDirectory $r -NoOpen
          if($LASTEXITCODE -ne 0){throw 'Adaptive family attribution failed'}
          $result=Get-Content (Join-Path $r 'QTS_ADAPTIVE_REVIEW.json') -Raw|ConvertFrom-Json
          if($result.status -ne 'RECONCILED_REVIEW_REQUIRED' -or
             $result.broker_positions.positions -ne 2 -or
             $result.broker_positions.net_usd -ne -2.5 -or
             @($result.selected_family).Count -ne 2 -or
             $result.selected_family[0].family -ne 'Retest' -or
             $result.selected_family[1].family -ne 'Sweep and reclaim') {
             throw 'Adaptive attribution invented family, counted unrelated trades or misstated net'
          }
          if(-not (Test-Path (Join-Path $r 'QTS_ADAPTIVE_REVIEW.html'))){
             throw 'Missing local adaptive HTML'
          }
          Write-Host 'Adaptive per-position provenance and reconciled family report: PASS'
