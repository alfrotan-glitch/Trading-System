name: UI diagnostic (temporary)

# TEMPORARY. The `fast` job's UI step fails on every run of this repository
# while `npm ci && npm test` passes locally AND on the runner in isolation
# (48/48, exit 0 — see the earlier comment). This workflow replicates the exact
# fast-job step sequence and posts the UI suite's raw output to the pull
# request, so the failure can be read (and fixed or classified with evidence)
# instead of guessed at. Delete this file once that is done.

on:
  workflow_dispatch:
  push:
    branches: ["arena/fd6fbd1d-trading-system"]

permissions:
  contents: read
  pull-requests: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Install UI test dependencies
        run: npm ci
      - name: Static checks
        run: |
          ruff check src/ tests/
          mypy src
          bandit -q -r src
      - name: Fast Python suite (non-extended tests only)
        run: pytest -q --ignore=tests/integration --ignore=tests/research
      - name: UI tests (captured)
        id: ui
        continue-on-error: true
        run: |
          set +e
          npm test > /tmp/ui.out 2>&1
          status=$?
          echo "npm test exit status: ${status}" >> /tmp/ui.out
          tail -n 400 /tmp/ui.out > /tmp/ui.tail
          cat /tmp/ui.tail
          exit $status
      - name: Post the captured output to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          {
            echo "Temporary UI diagnostic for \`${HEAD_SHA:0:8}\` — full fast-job sequence, Node $(node --version)."
            echo
            echo '```'
            cat /tmp/ui.tail
            echo '```'
          } > /tmp/comment.md
          gh pr comment 9 --body-file /tmp/comment.md
