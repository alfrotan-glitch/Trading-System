name: QTS one-time verified branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qts-one-time-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  remove-merged-branches:
    if: github.event.head_commit.message == 'chore: launch verified QTS one-time branch cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify ancestry and delete only unchanged merged refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git merge-base --is-ancestor 0747429064d0a28e0e8b64e685d433606d311ec0 origin/main
          mapfile -t branch_refs < <(git ls-remote --heads origin | awk '$2 != "refs/heads/main" {print $1 " " $2}')
          echo "Found ${#branch_refs[@]} non-main branches"
          for item in "${branch_refs[@]}"; do
            sha="${item%% *}"
            ref="${item#* }"
            if ! git cat-file -e "${sha}^{commit}"; then
              echo "::error::Missing fetched commit for ${ref}"
              exit 1
            fi
            if ! git merge-base --is-ancestor "${sha}" origin/main; then
              echo "::error::Unmerged work on ${ref}; refusing ALL branch deletions"
              exit 1
            fi
          done
          # Exact remote-SHA leases protect against concurrent updates.
          for item in "${branch_refs[@]}"; do
            sha="${item%% *}"
            ref="${item#* }"
            git push "--force-with-lease=${ref}:${sha}" origin ":${ref}"
            echo "Deleted verified merged ref ${ref}"
          done
          mapfile -t remaining < <(git ls-remote --heads origin)
          if [[ "${#remaining[@]}" -ne 1 || "${remaining[0]}" != *"refs/heads/main" ]]; then
            echo "::error::Cleanup incomplete: ${#remaining[@]} refs remain"
            printf '%s\n' "${remaining[@]}"
            exit 1
          fi
          echo "SUCCESS: only main remains."
