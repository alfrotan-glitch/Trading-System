[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qts"
version = "1.0.1"
description = "Autonomous Quant Research & Trading System — XAUUSD/MT5 modular monolith"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["quantitative-research", "gold", "xauusd", "metatrader5", "risk-management"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  # Upper bounds are deliberate: the verified release matrix is Python 3.11-3.14
  # with the majors below. A new major is a compatibility event, not a patch.
  "pydantic>=2.5,<3",
  "pandas>=2.0,<4",
  "numpy>=1.25,<3",
  "pyarrow>=14,<27",
  "pyyaml>=6.0,<7",
  "click>=8.1,<9",
  "scipy>=1.11,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
# Release tooling is optional so a production install stays lean.
packaging = [
  "build>=1.2",
  "pyinstaller>=6.0; sys_platform == 'win32'",
]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "pytest-xdist>=3.6",
  "hypothesis>=6.90",
  "mypy>=1.8",
  "ruff>=0.3",
  "bandit>=1.7",
  "pandas-stubs",
  "httpx>=0.27",
  "anyio>=4.0",
]

[project.scripts]
qts = "qts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The desktop workstation is data, not Python: without this the wheel installs
# an API with no UI at "/" (a blank page) — a real defect caught by the release gate.
[tool.setuptools.package-data]
qts = [
  "desktop/ui/*.html",
  "desktop/ui/css/*.css",
  "desktop/ui/js/*.js",
  "desktop/ui/js/views/*.js",
  "data/fixtures/*.csv",
  "config/configs/*.yaml",
]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","UP","B","C4","SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = false
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -n auto --dist loadscope"
# `scripts/` is a plain directory (no package install), so the repository root
# must be importable for `from scripts.<module> import ...` in the test suite.
# Without this, the README-documented `pytest -q` entry point fails collection
# for tests/test_mt5_gap_disposition.py, tests/test_mt5_history_driver.py and
# tests/test_mt5_history_probe.py (only `python -m pytest` happened to work,
# because it prepends the cwd). Fail closed: the whole suite must collect.
pythonpath = ["."]
markers = [
    "integration: integration tests requiring fixtures",
]

[tool.coverage.run]
source = ["qts"]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
