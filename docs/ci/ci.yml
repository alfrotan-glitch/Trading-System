name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/qts --ignore-missing-imports
      - run: bandit -r src -q
      - run: pytest tests -q --cov=qts --cov-fail-under=60
      - run: pytest tests/integration -q --run-integration
