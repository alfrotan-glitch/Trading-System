# Not installed. Do not copy this file to .github/workflows/ and do not run
# it in the research sandbox. The installed runner job is
# .github/workflows/canonical-xauusd-zip-inventory.yml. That job is the only
# place that reads the listed release asset. This copy does not download it.
name: Canonical XAUUSD zip inventory

on:
  push:
    branches:
      - arena/01a0c9cc-trading-system
    paths:
      - .github/workflows/canonical-xauusd-zip-inventory.yml
      - scripts/inventory_canonical_xauusd_zip.py
      - src/qts/data/canonical_zip_inventory.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QTS
        run: pip install -e .

      - name: Require the already-present canonical zip
        run: |
          test -f data/raw/mt5_ticks/XAUUSD_730d_20260919T114013Z.zip

      - name: Inventory without repair
        id: inventory
        env:
          QTS_INVENTORY_EXECUTION_HOST: github-actions-runner
        run: |
          set +e
          python scripts/inventory_canonical_xauusd_zip.py \
            --zip data/raw/mt5_ticks/XAUUSD_730d_20260919T114013Z.zip \
            --output reports/canonical_zip_inventory.json \
            --work-dir /tmp/qts_canonical_zip
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Emit bounded inventory for API retrieval
        if: always()
        run: |
          if [ -f reports/canonical_zip_inventory.json ]; then
            echo "BEGIN_QTS_INVENTORY_JSON"
            cat reports/canonical_zip_inventory.json
            echo "END_QTS_INVENTORY_JSON"
          else
            echo "BEGIN_QTS_INVENTORY_JSON"
            echo '{"status":"UNAVAILABLE","provenance":"inventory script produced no report"}'
            echo "END_QTS_INVENTORY_JSON"
          fi
          echo "inventory_exit=${{ steps.inventory.outputs.exit_code }}"

      - name: Fail closed when identity was not established
        if: always()
        run: |
          code="${{ steps.inventory.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "inventory exit $code"
            exit "$code"
          fi
